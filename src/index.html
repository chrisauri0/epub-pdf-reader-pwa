<!doctype html>
<html lang="es">
<head>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
  <meta charset="utf-8">
  <title>Mi Biblioteca</title>
  <base href="/">

  <!-- Viewport correcto para iPad, con soporte de safe-area (notch/home indicator) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <!-- iOS: hace que abra en modo standalone (sin barra de Safari) al agregarla a inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Biblioteca">

  <!-- iOS ignora el ícono del manifest.webmanifest, necesita este específico -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Manifest normal (para Android/otros, y buena práctica tenerlo igual) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a1a1a">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <script>
  if (typeof Iterator === 'undefined') {
    window.Iterator = function Iterator() {};
    window.Iterator.prototype = {};
  }
  if (typeof Promise.try !== 'function') {
    Promise.try = function(fn, ...args) {
      return new Promise((resolve) => resolve(fn(...args)));
    };
  }
</script>
  <app-root></app-root>

</body>
</html>
