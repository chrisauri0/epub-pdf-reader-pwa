<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
  <meta charset="utf-8">
  <title>Mi Biblioteca</title>
  <base href="/">

  <!-- Viewport correcto para iPad, con soporte de safe-area (notch/home indicator) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <!-- iOS: hace que abra en modo standalone (sin barra de Safari) al agregarla a inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Biblioteca">

  <!-- iOS ignora el ícono del manifest.webmanifest, necesita este específico -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Manifest normal (para Android/otros, y buena práctica tenerlo igual) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a1a1a">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

<script>
  // Polyfills para APIs de JS muy recientes que Safari 17.x de iPadOS aún no soporta
  // (requeridos por epubjs y pdfjs-dist)

  if (typeof Iterator === 'undefined') {
    window.Iterator = function Iterator() {};
    window.Iterator.prototype = {};
  }

  if (typeof Promise.try !== 'function') {
    Promise.try = function(fn, ...args) {
      return new Promise((resolve) => resolve(fn(...args)));
    };
  }

  if (typeof Uint8Array.prototype.toHex !== 'function') {
    Uint8Array.prototype.toHex = function() {
      return Array.from(this).map(b => b.toString(16).padStart(2, '0')).join('');
    };
  }

  if (typeof Uint8Array.prototype.setFromHex !== 'function') {
    Uint8Array.prototype.setFromHex = function(hex) {
      const len = Math.floor(hex.length / 2);
      for (let i = 0; i < len && i < this.length; i++) {
        this[i] = parseInt(hex.substr(i * 2, 2), 16);
      }
      return { read: len * 2, written: len };
    };
  }

  if (typeof Uint8Array.fromHex !== 'function') {
    Uint8Array.fromHex = function(hex) {
      const arr = new Uint8Array(Math.floor(hex.length / 2));
      arr.setFromHex(hex);
      return arr;
    };
  }
</script>
