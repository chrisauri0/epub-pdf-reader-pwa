<div class="pdf-viewer">
  <header class="viewer-toolbar">
    <button class="back-btn" (click)="goBack()">← Volver</button>
    <span class="page-indicator">{{ currentPage() }} / {{ totalPages() }}</span>
  </header>

  @if (isLoading()) {
    <p class="loading">Cargando PDF...</p>
  }

  <div
    #canvasContainer
    class="canvas-container"
    [class.hidden]="isLoading()"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    <canvas #pdfCanvas></canvas>
  </div>

  <div class="floating-nav" [class.hidden]="isLoading()">
    <button class="nav-btn prev" (click)="prevPage()" [disabled]="currentPage() <= 1" aria-label="Página anterior">
      ‹
    </button>
    <button class="nav-btn next" (click)="nextPage()" [disabled]="currentPage() >= totalPages()" aria-label="Página siguiente">
      ›
    </button>
  </div>
</div>
